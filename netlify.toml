# Netlify-Konfiguration für die Weinakademie Rickenbach
[build]
  publish = "."
  functions = "netlify/functions"

# Schöner API-Pfad (optional): /api/media -> Function "media"
[[redirects]]
  from = "/api/media"
  to = "/.netlify/functions/media"
  status = 200

# Seite (inkl. PDF) aus Suchmaschinen fernhalten – gilt für alle Dateien
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
